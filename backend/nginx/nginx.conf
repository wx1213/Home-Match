# ============================================================
#  HomeMatch Nginx Reverse Proxy (Sprint2-#9)
# ============================================================
#
# 部署在 backend 容器前面，负责：
#   1. HTTPS 终止（证书挂到 /etc/nginx/certs）
#   2. 限流（limit_req）
#   3. gzip 压缩
#   4. 安全头（HSTS / X-Frame-Options / CSP）
#   5. /healthz 直接 200（不转给 backend，省一次连接）
#   6. /uploads/ 直通 OSS CDN（避免走后端）

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;  # 比后端 max_upload_size_mb=8 略大，容错

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # 限流区（按 IP；登录/sms 端点更严）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # 上游 backend（compose service name）
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name api.homematch.com;

        # SSL 证书（由 ops 挂到 /etc/nginx/certs）
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # 健康检查：直接 200（不往后端转）
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # 限流 + 反代
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 认证端点更严限流（防撞库 + 短信轰炸）
        location ~ ^/v1/auth/(sms-code|login|wechat-login|apple-login) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 上传的图片走 CDN（不走后端）
        # APP 端拿到的 URL 形如 https://cdn.homematch.com/uploads/xxx.jpg
        # 这里只是 fallback，万一 CDN 没配好直接走 OSS
        location /uploads/ {
            proxy_pass https://hmatch-prod.oss-cn-beijing.aliyuncs.com/;
            proxy_set_header Host hmatch-prod.oss-cn-beijing.aliyuncs.com;
            expires 7d;
        }
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name api.homematch.com;
        return 301 https://$host$request_uri;
    }
}
